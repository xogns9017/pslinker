    function calculateRemainingTime(lastMessageAt, categoryKey) {
      if (!lastMessageAt) return { text: '⏱️ 기한 없음', isExpired: false };
      const cat = CATEGORIES[categoryKey] || CATEGORIES.STUDY;
      const limitMs = cat.limitHours * 3600 * 1000;
      const diffMs = (lastMessageAt + limitMs) - Date.now();

      if (diffMs <= 0) return { text: '💥 폭파됨', isExpired: true };

      const hours = Math.floor(diffMs / (3600 * 1000));
      const mins = Math.floor((diffMs % (3600 * 1000)) / (60 * 1000));
      return { text: `⏱️ ${hours}시간 ${mins}분 후 폭파 예정`, isExpired: false };
    }

    function filterText(text) {
      if (!text) return { cleanText: '', isFiltered: false, foundWords: [] };
      let cleanText = text;
      let isFiltered = false;
      const foundWords = [];

      const stripped = text.replace(/[\s\d\W\_]/g, '').toLowerCase();
      const collapsed = stripped.replace(/(.)+/g, '$1');

      [...BAD_WORDS_BASE, ...ENGLISH_QWERTY_BAD_WORDS].forEach(bad => {
        if (stripped.includes(bad) || collapsed.includes(bad)) {
          isFiltered = true;
          if (!foundWords.includes(bad)) foundWords.push(bad);
        }
      });

      PROFANITY_PATTERNS.forEach(pattern => {
        if (pattern.test(cleanText) || pattern.test(stripped) || pattern.test(collapsed)) {
          isFiltered = true;
          cleanText = cleanText.replace(pattern, (match) => '*'.repeat(match.length));
        }
      });

      if (/ㅗ/.test(stripped) && (stripped === 'ㅗ' || /^ㅗ+$/.test(stripped) || /ㅗ{2,}/.test(stripped))) {
        isFiltered = true;
        cleanText = cleanText.replace(/ㅗ+/g, '*');
      }

      return { cleanText, isFiltered, foundWords };
    }

          triggerToast('⏱️ 메시지 전송 후 1분 20초가 지나 수정할 수 없습니다.', 'warning');
          setShowEditMsgModal(false);
          setShowMsgActionModal(false);
          return;
        }

        const { cleanText, isFiltered } = filterText(editMsgText.trim());
        if (isFiltered) {
          triggerToast('🚨 수정 내용에 부적절한 표현이 포함되어 있습니다.', 'warning');
          return;
        }

        setAllMessages(prev => prev.map(m => m.id === selectedMsgForAction.id ? { ...m, text: cleanText, isEdited: true } : m));
        triggerToast('✏️ 메시지가 수정되었습니다.', 'success');
        setShowEditMsgModal(false);
        setShowMsgActionModal(false);
      };

      const handleDeleteMessage = () => {
        if (!selectedMsgForAction) return;
        const msgAgeMs = Date.now() - selectedMsgForAction.timestamp;
        const TIME_LIMIT_MS = 80 * 1000;

        if (msgAgeMs > TIME_LIMIT_MS) {
          triggerToast('⏱️ 메시지 전송 후 1분 20초가 지나 삭제할 수 없습니다.', 'warning');
          setShowMsgActionModal(false);
          return;
        }

        setAllMessages(prev => prev.filter(m => m.id !== selectedMsgForAction.id));
        triggerToast('🗑️ 메시지가 삭제되었습니다.', 'info');
        setShowMsgActionModal(false);
      };

      const handleReportMessageSubmit = (e) => {
        if (e) e.preventDefault();
        if (!selectedMsgForAction) return;

        const roomObj = rooms.find(r => r.id === selectedMsgForAction.roomId);
        const reportedUser = adminUserList.find(u => u.nickname === selectedMsgForAction.sender || u.email === selectedMsgForAction.senderEmail);

        const newReport = {
          id: `rep-${Date.now()}`,
          messageId: selectedMsgForAction.id,
          roomId: selectedMsgForAction.roomId,
          roomTitle: roomObj?.title || '대화방',
          reporterNick: currentUser.nickname,
          reporterRealName: currentUser.realName || '미입력',
          reporterEmail: currentUser.email,
          reportedUserNick: selectedMsgForAction.sender,
          reportedUserRealName: reportedUser?.realName || '미입력',
          reportedUserEmail: selectedMsgForAction.senderEmail || '정보 없음',
          messageText: selectedMsgForAction.text,
          messageImage: selectedMsgForAction.image,
          reason: reportReason,
          timestamp: Date.now(),
          status: 'PENDING'

        setReports(prev => [newReport, ...prev]);
        setShowReportMsgModal(false);
        setShowMsgActionModal(false);

      };

      const resolveReport = (reportId, actionMessage = '✅ 신고가 처리 완결되었습니다.') => {
        setReports(prev => prev.filter(r => r.id !== reportId));
        if (actionMessage) {
          triggerToast(actionMessage, 'success');
        }
      };

      // ✨ 대화방 생성 및 DB 저장
      const handleCreateRoom = async (e) => {
        if (e) e.preventDefault();
        const titleTrimmed = newRoomTitle.trim();
        if (!titleTrimmed) return;

        const { isBanned, timeText } = checkUserBanned();
        if (isBanned) {
          triggerToast(`⛔ 채팅이 차단된 계정입니다. (남은 차단 시간: ${timeText})`, 'danger');
          return;
        }

        const { cleanText, isFiltered } = filterText(titleTrimmed);
        if (isFiltered) {
          triggerToast('🚨 부적절한 단어나 욕설이 들어간 방 제목은 개설할 수 없습니다.', 'danger');
          return;
        }

        const roomId = `room-${Date.now()}`;
        const now = Date.now();

        const newRoom = {
          id: roomId,
          title: cleanText,
          category: newRoomCategory,
          creator: currentUser.nickname,
          creatorEmail: currentUser.email,
          membersCount: 1,
          lastMessageAt: now,
          createdAt: now,
          image: newRoomImage || null
        };

        const sysMsg = {
          id: `m-${now}`,
          roomId: roomId,
          sender: '시스템',
          text: `🎉 '${cleanText}' 대화방이 개설되었습니다.`,
          timestamp: now,
          isSystem: true
        };

        setRooms(prev => [newRoom, ...prev]);
        setAllMessages(prev => [...prev, sysMsg]);
        setNewRoomTitle('');
        setNewRoomImage(null);
        setShowCreateModal(false);
        setActiveRoomId(roomId);
        triggerToast(`💬 '${cleanText}' 대화방이 개설되었습니다!`, 'success');

        // DB 저장
        const dbRoomObj = {
          id: roomId,
          title: cleanText,
          category: newRoomCategory,
          creator: currentUser.nickname,
          creator_email: currentUser.email,
          members_count: 1,
          last_message_at: now,
          created_at: now,
          image: newRoomImage || null
        };

        const dbSysMsgObj = {
          id: `m-${now}`,
          room_id: roomId,
          sender: '시스템',
          text: `🎉 '${cleanText}' 대화방이 개설되었습니다.`,
          timestamp: now,
          is_system: true
        };

        const { error } = await db.from('rooms').insert([dbRoomObj]);
        if (error) {
          triggerToast('🚨 방 개설 DB 저장 실패: ' + error.message, 'danger');
        } else {
          await db.from('messages').insert([dbSysMsgObj]);
        }
      };

      const handleCreateLostItem = (e) => {
        if (e) e.preventDefault();
        if (!lostForm.title.trim()) return;

        const newItem = {
          id: `l-${Date.now()}`,
          title: lostForm.title.trim(),
          location: lostForm.location.trim() || '교내 지정장소',
          date: '방금 전',
          status: '보관중',
          timestamp: Date.now(),
          image: lostForm.image || null

        setLostItems(prev => [newItem, ...prev]);

        setLostForm({ title: '', location: '', date: '', image: null });

      };

      const handleAdminBanUser = (userId, hours) => {
        const banUntilTimestamp = hours > 0 ? Date.now() + hours * 3600 * 1000 : null;
        setAdminUserList(prev => prev.map(u => u.id === userId ? { ...u, bannedUntil: banUntilTimestamp } : u));
        if (currentUser.id === userId) {
          setCurrentUser(prev => ({ ...prev, bannedUntil: banUntilTimestamp }));
        }

        if (hours > 0) {
          const timeLabel = hours >= 24 ? `${Math.round(hours / 24)}일` : `${hours}시간`;
          triggerToast(`⛔ 채팅 ${timeLabel} 차단이 설정되었습니다.`, 'warning');
        } else {
          triggerToast(`✅ 채팅 차단이 해제되었습니다.`, 'success');
        }
      };

      const confirmForceDeleteUser = () => {
        if (!userToDelete) return;
        const targetId = userToDelete.id;
        const targetNick = userToDelete.nickname;
        const targetEmail = userToDelete.email;

        setAdminUserList(prev => prev.filter(u => u.id !== targetId));
        setReports(prev => prev.filter(r => r.reportedUserEmail !== targetEmail && r.reportedUserNick !== targetNick));

        if (currentUser.id === targetId) {
          setIsLoggedIn(false);
          setAuthStep(1);
          triggerToast(`🚨 현재 접속중인 계정이 강제 삭제되어 로그아웃되었습니다.`, 'danger');
        } else {
          triggerToast(`🗑️ '${targetNick}' 계정이 영구 삭제되고 관련 신고도 처리 완료되었습니다.`, 'danger');

        setUserToDelete(null);

      const confirmForceCloseRoom = () => {

        const roomId = roomToDelete.id;
        const roomTitle = roomToDelete.title;

        setRooms(prev => prev.filter(r => r.id !== roomId));

        setReports(prev => prev.filter(r => r.roomId !== roomId));

        if (activeRoomId === roomId) setActiveRoomId(null);
        if (adminInspectedRoomId === roomId) setAdminInspectedRoomId(null);

        triggerToast(`🗑️ '${roomTitle}' 대화방이 즉시 강제 폐쇄되었습니다.`, 'danger');
        setRoomToDelete(null);
      };

      const handleAdminDeleteMessage = (msgId) => {
        setAllMessages(prev => prev.filter(m => m.id !== msgId));

      };

      const currentRoomMessages = useMemo(() => {
        if (!activeRoomId) return [];
        return allMessages.filter(m => m.roomId === activeRoomId).sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
      }, [allMessages, activeRoomId]);

      const filteredRooms = useMemo(() => {
        return rooms.filter(room => {
          if (selectedCategory !== 'ALL' && room.category !== selectedCategory) return false;
          if (searchQuery.trim() && !room.title.toLowerCase().includes(searchQuery.toLowerCase())) return false;
          const { isExpired } = calculateRemainingTime(room.lastMessageAt, room.category);
          return !isExpired;
        });
      }, [rooms, selectedCategory, searchQuery]);

      const classRankings = useMemo(() => {
        const classMap = {};
        adminUserList.forEach(u => {
          const cls = u.gradeClass || '1학년 1반';
          if (cls === '교직원') return;
          if (!classMap[cls]) classMap[cls] = { name: cls, totalTemp: 0, count: 0 };
          classMap[cls].totalTemp += u.temperature;
          classMap[cls].count += 1;
        });

        return Object.values(classMap)
          .map(c => ({ name: c.name, avgTemp: Math.round((c.totalTemp / c.count) * 10) / 10, count: c.count }))
          .sort((a, b) => b.avgTemp - a.avgTemp);
      }, [adminUserList]);

      const activeRoom = rooms.find(r => r.id === activeRoomId);

      const renderFormattedText = (text) => {
        if (!text) return null;
        if (text.includes('```')) {
          const parts = text.split('```');
          return (
            <div className="space-y-1">
              {parts.map((part, i) => {
                if (i % 2 === 1) {
                  return (
                    <pre key={i} className="bg-slate-900 text-emerald-400 p-2.5 rounded-lg text-[11px] font-mono overflow-x-auto border border-slate-700">
                      <code>{part.trim()}</code>
                    </pre>
                  );
                }
                return part ? <p key={i}>{part}</p> : null;
              })}
            </div>
          );
        }
        if (text.includes('$')) {
          const parts = text.split('$');
          return (
            <span>
              {parts.map((part, i) => {
                if (i % 2 === 1) {
                  return (
                    <span key={i} className="inline-block px-2 py-0.5 bg-amber-100 text-amber-900 rounded font-mono font-bold text-[11px] border border-amber-300 mx-0.5 shadow-sm">
                      {part}
                    </span>
                  );
                }
                return part;
              })}
            </span>
          );
        }
        return text;
      };

      // LOGIN SCREEN
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-slate-900 text-slate-800 flex justify-center items-center font-sans antialiased p-4 ios-scroll">
            <div className="w-full max-w-md bg-white rounded-3xl p-6 shadow-2xl space-y-6 relative overflow-hidden border border-slate-100">
              
              <div className="text-center space-y-2">
                <div className="w-16 h-16 bg-teal-600 text-white rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-teal-200">
                  <HeartHandshake className="w-9 h-9" />
                </div>
                <h1 className="text-2xl font-black text-slate-900 tracking-tight">풍생 링커 로그인</h1>
                <p className="text-xs text-teal-700 font-bold">Poongsaeng High School Linker</p>
                <p className="text-[11px] text-slate-500">교내 전용 이메일(<span className="font-mono text-teal-600 font-bold">@ps.hs.kr</span>)로 안전하게 인증하세요.</p>
              </div>

              {authError && (
                <div className="p-3 bg-rose-50 text-rose-700 text-xs font-bold rounded-2xl border border-rose-200 flex items-center gap-2">
                  <Shield className="w-4 h-4 text-rose-500 shrink-0" />
                  <span>{authError}</span>
                </div>
              )}

              {authStep === 1 && (
                <form onSubmit={handleRequestAuthCode} className="space-y-4">
                  <div className="space-y-1">
                    <label className="block text-xs font-extrabold text-slate-700">교내 이메일 주소</label>
                    <div className="relative">
                      <Mail className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                      <input 
                        type="email" 
                        value={loginEmail} 
                        onChange={(e) => setLoginEmail(e.target.value)}
                        placeholder="예: student1@ps.hs.kr" 
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-9 pr-3 py-3 text-xs text-slate-900 font-medium focus:outline-none focus:border-teal-600"
                        required
                      />
                    </div>
                  </div>

                  <button type="submit" className="w-full py-3.5 bg-teal-600 hover:bg-teal-700 text-white font-extrabold rounded-2xl text-xs shadow-lg transition flex items-center justify-center gap-2">
                    <span>인증코드 발송</span>
                    <ArrowRight className="w-4 h-4" />
                  </button>
                </form>
              )}

              {authStep === 2 && (
                <form onSubmit={handleVerifyAuthCode} className="space-y-4">
                  <div className="p-3 bg-teal-50 rounded-2xl border border-teal-200 text-xs text-teal-900 space-y-1">
                    <p className="font-extrabold">📬 수신 이메일: {loginEmail}</p>
                    <p className="text-[11px] text-teal-700">아래 웹메일 수신함 버튼을 눌러 발송된 6자리 코드를 확인해 주세요.</p>
                  </div>

                  <div className="space-y-1">
                    <label className="block text-xs font-extrabold text-slate-700">6자리 인증번호</label>
                    <div className="relative">
                      <KeyRound className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                      <input 
                        type="text" 
                        value={verificationCode} 
                        onChange={(e) => setVerificationCode(e.target.value)}
                        placeholder="인증번호 6자리 입력" 
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-9 pr-3 py-3 text-xs text-slate-900 font-mono font-bold tracking-widest focus:outline-none focus:border-teal-600"
                        maxLength="6"
                        required
                      />
                    </div>
                  </div>

                  <div className="flex gap-2">
                    <button type="button" onClick={() => setShowWebmailModal(true)} className="flex-1 py-3 bg-amber-100 hover:bg-amber-200 text-amber-900 font-extrabold rounded-2xl text-xs transition border border-amber-200">
                      📬 웹메일 수신함 열기
                    </button>
                    <button type="submit" className="flex-1 py-3 bg-teal-600 hover:bg-teal-700 text-white font-extrabold rounded-2xl text-xs shadow transition">
                      인증 확인
                    </button>
                  </div>
                </form>
              )}

              {authStep === 3 && (
                <form onSubmit={handleCompleteRegistration} className="space-y-4">
                  <div className="p-3 bg-emerald-50 text-emerald-900 text-xs font-extrabold rounded-2xl border border-emerald-200">

                  </div>

                    <label className="block text-xs font-extrabold text-slate-700">사용할 익명 닉네임</label>
                    <input 
                      type="text" 
                      value={authNickname} 
                      onChange={(e) => setAuthNickname(e.target.value)}
                      placeholder="예: 푸른풍생인" 
                      className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-3 text-xs text-slate-900 font-bold focus:outline-none focus:border-teal-600"
                      required
                    />
                  </div>

                    <label className="block text-xs font-extrabold text-slate-700 flex items-center justify-between">
                      <span>실명 / 본명</span>
                      <span className="text-[10px] text-rose-500 font-bold">🔒 관리자에게만 비공개 제공</span>
                    </label>
                    <input 
                      type="text" 
                      value={authRealName} 
                      onChange={(e) => setAuthRealName(e.target.value)}
                      placeholder="예: 홍길동 (학생증/본인 확인용)" 
                      className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-3 text-xs text-slate-900 font-bold focus:outline-none focus:border-teal-600"
                      required

                  <button type="submit" className="w-full py-3.5 bg-teal-600 hover:bg-teal-700 text-white font-extrabold rounded-2xl text-xs shadow-lg transition">
                    풍생 링커 시작하기 🌱
                  </button>
                </form>
              )}

              <div className="pt-4 border-t border-slate-100 text-center">
                <button 
                  type="button"
                  onClick={() => setShowLoginBetaModal(true)}
                  className="px-3.5 py-1.5 bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 rounded-full text-[11px] font-extrabold transition shadow-sm inline-flex items-center gap-1.5"
                >
                  <span>🧪 베타 계정 선택</span>
                </button>

            {/* BETA ACCOUNT SELECTION MODAL */}
            {showLoginBetaModal && (
              <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">

                  <div className="flex items-center justify-between border-b pb-3">

                    </div>
                    <button onClick={() => setShowLoginBetaModal(false)} className="text-slate-400 p-1"><X className="w-4 h-4" /></button>

                  <div className="space-y-2 max-h-72 overflow-y-auto ios-scroll">
                    {adminUserList.map(acc => (
                      <button

                          setIsLoggedIn(true);
                          setShowLoginBetaModal(false);
                          if (acc.isAdmin) setActiveTab('admin');
                          else setActiveTab('home');
                          triggerToast(`🧪 [${acc.nickname}] (${acc.role}) 계정으로 접속했습니다.`, 'info');
                        }}
                        className="w-full p-3 bg-slate-50 hover:bg-purple-50 border border-slate-200 rounded-2xl text-left flex items-center justify-between transition text-xs font-bold"
                      >
                        <div>
                          <p className="text-slate-900 font-extrabold">{acc.nickname}</p>
                          <p className="text-[10px] text-slate-400">{acc.role} • {acc.email}</p>
                        </div>
                        <span className="text-amber-600 font-mono font-bold w-12 text-right">{Number(acc.temperature).toFixed(1)}℃</span>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* Simulated Webmail Inbox Modal */}
            {showWebmailModal && (
              <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl border border-slate-200">
                  <div className="flex items-center justify-between border-b pb-3">
                    <div className="flex items-center gap-2">
                      <Mail className="w-5 h-5 text-teal-600" />
                      <h3 className="font-extrabold text-sm text-slate-900">교내 웹메일 수신함 (@ps.hs.kr)</h3>
                    </div>
                    <button onClick={() => setShowWebmailModal(false)} className="text-slate-400 p-1"><X className="w-4 h-4" /></button>
                  </div>

                  <div className="space-y-2 max-h-60 overflow-y-auto ios-scroll">
                    {simulatedEmails.length === 0 ? (
                      <p className="text-xs text-slate-400 text-center py-6">수신된 이메일이 없습니다.</p>
                    ) : (
                      simulatedEmails.map(mail => (
                        <div key={mail.id} className="p-3 bg-slate-50 rounded-2xl border border-slate-200 space-y-1 text-xs">
                          <div className="flex justify-between font-bold text-slate-800">
                            <span>{mail.subject}</span>
                            <span className="text-[10px] text-slate-400">{mail.timestamp}</span>
                          </div>
                          <p className="text-slate-600 text-[11px]">{mail.body}</p>
                          <div className="pt-1 flex justify-end">
                            <button 
                              onClick={() => {
                                setVerificationCode(mail.code);
                                setShowWebmailModal(false);
                                triggerToast('🔑 인증코드가 자동 입력되었습니다.', 'success');
                              }}
                              className="px-2.5 py-1 bg-teal-600 text-white font-extrabold rounded-lg text-[10px]"
                            >
                              자동 입력
                            </button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}

          </div>
        );
      }

      // MAIN APP SCREEN
      return (
        <div className="min-h-screen bg-slate-100 text-slate-800 flex justify-center font-sans antialiased">
          <div className="w-full max-w-md bg-white min-h-screen flex flex-col shadow-2xl relative pb-24 border-x border-slate-200">
            
            {toastMessage && (
              <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-full shadow-xl text-xs font-bold flex items-center gap-2 transition-all ${
                toastMessage.type === 'success' ? 'bg-emerald-600 text-white' : 
                toastMessage.type === 'danger' ? 'bg-rose-600 text-white' : 
                toastMessage.type === 'warning' ? 'bg-amber-500 text-white' : 'bg-slate-800 text-white'
              }`}>
                <Sparkles className="w-4 h-4" />
                <span>{toastMessage.text}</span>
              </div>
            )}

            {!activeRoomId && (

                  <form onSubmit={handleReportMessageSubmit} className="space-y-3 text-xs">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">신고 사유 선택</label>
                      <select 
                        value={reportReason} 
                        onChange={(e) => setReportReason(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 font-bold text-xs"
                      >
                        <option value="인격모독 / 비하 발언">인격모독 / 모욕 / 비하 발언</option>
                        <option value="성적 수치심 / 불쾌감 유발">성적 수치심 / 음란성 발언</option>
                        <option value="심한 욕설 및 비속어">심한 욕설 및 비속어 사용</option>
                        <option value="개인정보 유출 위험">개인정보 유출 시도</option>
                        <option value="기타 부적절한 행위">기타 부적절한 행위</option>
                      </select>
                    </div>

                    <div className="p-3 bg-rose-50 rounded-2xl border border-rose-100 text-[11px] text-rose-800 leading-relaxed">
                      신고 내용과 피신고자(작성자)의 정보가 총괄 관리자(`UM1117@ps.hs.kr`)에게 실시간으로 전달되어 조치됩니다.
                    </div>

                    <div className="flex gap-2 pt-1">
                      <button type="button" onClick={() => setShowReportMsgModal(false)} className="flex-1 py-3 bg-slate-100 text-slate-700 font-bold rounded-2xl text-xs">취소</button>
                      <button type="submit" className="flex-1 py-3 bg-rose-600 hover:bg-rose-700 text-white font-extrabold rounded-2xl text-xs shadow">신고 접수</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL: CUSTOM CONFIRMATION FOR USER DELETE */}
            {userToDelete && (
              <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl border border-rose-100">
                  <div className="flex items-center gap-2 text-rose-600">
                    <AlertTriangle className="w-6 h-6" />
                    <h3 className="font-extrabold text-base text-slate-900">계정 영구 강제 삭제</h3>
                  </div>
                  <div className="p-3 bg-rose-50 rounded-2xl border border-rose-200 text-xs text-rose-900 space-y-1">
                    <p className="font-extrabold">대상: {userToDelete.nickname} (본명: {userToDelete.realName || '미입력'})</p>
                    <p className="text-[11px] text-rose-700">이 계정을 정말로 시스템에서 강제 삭제하시겠습니까? 해당 유저는 즉시 탈퇴 처리되며 대화방에는 '삭제된 계정입니다'로 표시됩니다.</p>
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button onClick={() => setUserToDelete(null)} className="flex-1 py-3 bg-slate-100 text-slate-700 font-bold rounded-2xl text-xs">취소</button>
                    <button onClick={confirmForceDeleteUser} className="flex-1 py-3 bg-rose-600 hover:bg-rose-700 text-white font-extrabold rounded-2xl text-xs shadow">강제 삭제 실행</button>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL: CUSTOM CONFIRMATION FOR ROOM CLOSE */}
            {roomToDelete && (
              <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl border border-rose-100">
                  <div className="flex items-center gap-2 text-rose-600">
                    <AlertTriangle className="w-6 h-6" />
                    <h3 className="font-extrabold text-base text-slate-900">대화방 강제 폐쇄</h3>
                  </div>
                  <div className="p-3 bg-rose-50 rounded-2xl border border-rose-200 text-xs text-rose-900 space-y-1">
                    <p className="font-extrabold">방 제목: {roomToDelete.title}</p>
                    <p className="text-[11px] text-rose-700">이 대화방을 즉시 강제 폐쇄하시겠습니까? 방 안의 모든 메시지 내역이 영구 제거됩니다.</p>
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button onClick={() => setRoomToDelete(null)} className="flex-1 py-3 bg-slate-100 text-slate-700 font-bold rounded-2xl text-xs">취소</button>
                    <button onClick={confirmForceCloseRoom} className="flex-1 py-3 bg-rose-600 hover:bg-rose-700 text-white font-extrabold rounded-2xl text-xs shadow">대화방 폐쇄 실행</button>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL: CREATE ROOM */}
            {showCreateModal && (
              <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
                  <div className="flex items-center justify-between border-b pb-2">
                    <h3 className="font-extrabold text-base text-slate-900">새 대화방 개설</h3>
                    <button onClick={() => setShowCreateModal(false)} className="text-slate-400"><X className="w-5 h-5" /></button>
                  </div>
                  <form onSubmit={handleCreateRoom} className="space-y-3 text-xs">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">카테고리</label>
                      <select value={newRoomCategory} onChange={(e) => setNewRoomCategory(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2.5 text-xs font-bold">
                        {Object.values(CATEGORIES).map(cat => <option key={cat.id} value={cat.id}>[{cat.name}] - {cat.desc}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">제목</label>
                      <input type="text" value={newRoomTitle} onChange={(e) => setNewRoomTitle(e.target.value)} placeholder="대화방 제목 입력" className="w-full bg-slate-50 border rounded-xl p-2.5 text-xs" required />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">대표 사진 (선택)</label>
                      <input 
                        type="file" 
                        accept="image/*" 
                        onChange={(e) => {
                          const file = e.target.files?.[0];
                          if (file) {
                            validateAndProcessImage(file, (dataUrl) => setNewRoomImage(dataUrl));
                          }
                          e.target.value = '';
                        }} 
                        className="w-full bg-slate-50 border rounded-xl p-2 text-xs" 
                      />
                      {newRoomImage && (
                        <div className="mt-2 w-full h-24 rounded-xl overflow-hidden border border-slate-200 relative">
                          <img src={newRoomImage} alt="미리보기" className="w-full h-full object-cover" />
                          <button type="button" onClick={() => setNewRoomImage(null)} className="absolute top-1 right-1 bg-black/60 text-white p-1 rounded-full hover:bg-black/80 transition"><X className="w-3 h-3" /></button>
                        </div>
                      )}
                    </div>
                    <button type="submit" className="w-full py-3 bg-teal-600 text-white font-extrabold rounded-xl text-xs shadow">대화방 개설하기</button>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL: LOST ITEM POST */}
            {showLostPostModal && (
              <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
                  <div className="flex items-center justify-between border-b pb-2">
                    <h3 className="font-extrabold text-base text-slate-900">분실물 등록</h3>
                    <button onClick={() => setShowLostPostModal(false)} className="text-slate-400"><X className="w-5 h-5" /></button>
                  </div>
                  <form onSubmit={handleCreateLostItem} className="space-y-3 text-xs">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">습득물 제목</label>
                      <input type="text" value={lostForm.title} onChange={(e) => setLostForm({ ...lostForm, title: e.target.value })} placeholder="예: 2층 계단 샤프" className="w-full bg-slate-50 border rounded-xl p-2.5 text-xs" required />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">습득 장소</label>
                      <input type="text" value={lostForm.location} onChange={(e) => setLostForm({ ...lostForm, location: e.target.value })} placeholder="예: 중앙계단 3층" className="w-full bg-slate-50 border rounded-xl p-2.5 text-xs" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">습득물 사진 (선택)</label>
                      <input 
                        type="file" 
                        accept="image/*" 
                        onChange={(e) => {
                          const file = e.target.files?.[0];
                          if (file) {
                            validateAndProcessImage(file, (dataUrl) => setLostForm(prev => ({ ...prev, image: dataUrl })));
                          }
                          e.target.value = '';
                        }} 
                        className="w-full bg-slate-50 border rounded-xl p-2 text-xs" 
                      />
                      {lostForm.image && (
                        <div className="mt-2 w-full h-24 rounded-xl overflow-hidden border border-slate-200 relative">
                          <img src={lostForm.image} alt="습득물 사진" className="w-full h-full object-cover" />
                          <button type="button" onClick={() => setLostForm(prev => ({ ...prev, image: null }))} className="absolute top-1 right-1 bg-black/60 text-white p-1 rounded-full hover:bg-black/80 transition"><X className="w-3 h-3" /></button>
                        </div>
                      )}
                    </div>
                    <button type="submit" className="w-full py-3 bg-teal-600 text-white font-extrabold rounded-xl text-xs shadow">등록 완료</button>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL: USER PROFILE & MANNER RATING */}
            {showUserProfileModal && targetProfileUser && (() => {
              const evalKey = `${currentUser.email}_${targetProfileUser.email || targetProfileUser.nickname}`;
              const lastEvalTime = evaluationHistory[evalKey];
              const COOLDOWN_MS = 24 * 3600 * 1000;
              const isCoolingDown = lastEvalTime && (Date.now() - lastEvalTime < COOLDOWN_MS);
              const remainingHours = isCoolingDown ? Math.ceil((COOLDOWN_MS - (Date.now() - lastEvalTime)) / (3600 * 1000)) : 0;

              return (
                <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                  <div className="bg-white rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl border border-slate-100">
                    <div className="flex items-center justify-between border-b pb-3">
                      <div className="flex items-center gap-2">
                        <Thermometer className="w-5 h-5 text-amber-500" />
                        <h3 className="font-extrabold text-base text-slate-900">상대방 익명 프로필</h3>
                      </div>
                      <button onClick={() => setShowUserProfileModal(false)} className="text-slate-400 p-1"><X className="w-5 h-5" /></button>
                    </div>

                    <div className="p-4 bg-gradient-to-r from-amber-50 to-orange-50 rounded-2xl border border-amber-200 text-center space-y-1 shadow-inner">
                      <p className="text-xs font-extrabold text-slate-600">{targetProfileUser.nickname}</p>
                      <div className="flex items-center justify-center gap-1.5 pt-1">
                        <span className="text-xs">🌡️</span>
                        <p className="text-3xl font-black font-mono text-amber-600 tracking-tight">
                          {targetProfileUser.temperature ?? 36.5}℃
                        </p>
                      </div>
                      <p className="text-[10px] text-amber-800 font-bold">실시간 업데이트 완료</p>
                    </div>

                    <div className="space-y-2 text-xs">
                      <div className="flex items-center justify-between">
                        <p className="font-extrabold text-slate-700">매너 온도 평가 (+ / -)</p>
                        <span className="text-[10px] text-slate-400 font-medium">1인당 하루(24시간) 1회 가능</span>
                      </div>

                      {isCoolingDown ? (
                        <div className="p-3 bg-amber-50 rounded-2xl border border-amber-200 text-amber-900 text-xs font-bold space-y-1 flex items-start gap-2">
                          <Clock className="w-4 h-4 text-amber-600 shrink-0 mt-0.5" />
                          <div>
                            <p>오늘은 이미 온도를 평가했습니다.</p>
                            <p className="text-[10px] text-amber-700 font-normal">다음 평가까지 약 <span className="font-mono font-bold">{remainingHours}시간</span> 남아있습니다.</p>
                          </div>
                        </div>
                      ) : (
                        <div className="space-y-1.5">
                          <button onClick={() => handleProfileRating(0.1, '친절해요')} className="w-full p-2.5 bg-teal-50 hover:bg-teal-100 text-teal-800 rounded-xl text-left flex justify-between items-center font-bold transition border border-teal-200">
                            <span>"친절하고 따뜻해요"</span>
                            <span className="font-mono font-extrabold text-teal-600">+0.1℃</span>
                          </button>
                          <button onClick={() => handleProfileRating(0.2, '도움이 됐어요')} className="w-full p-2.5 bg-blue-50 hover:bg-blue-100 text-blue-800 rounded-xl text-left flex justify-between items-center font-bold transition border border-blue-200">
                            <span>"학업에 도움이 됐어요"</span>
                            <span className="font-mono font-extrabold text-blue-600">+0.2℃</span>
                          </button>
                          <button onClick={() => handleProfileRating(-0.1, '불친절해요')} className="w-full p-2.5 bg-rose-50 hover:bg-rose-100 text-rose-800 rounded-xl text-left flex justify-between items-center font-bold transition border border-rose-200">
                            <span>"불친절해요"</span>
                            <span className="font-mono font-extrabold text-rose-600">-0.1℃</span>
                          </button>
                          <button onClick={() => handleProfileRating(-0.2, '부적절한 발언')} className="w-full p-2.5 bg-rose-100 hover:bg-rose-200 text-rose-900 rounded-xl text-left flex justify-between items-center font-bold transition border border-rose-300">
                            <span>"부적절한 발언/태도"</span>
                            <span className="font-mono font-extrabold text-rose-700">-0.2℃</span>
                          </button>
                        </div>
                      )}
                    </div>

                    <button onClick={() => setShowUserProfileModal(false)} className="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs transition">
                      닫기
                    </button>
                  </div>
                </div>
              );
            })()}

            {/* MODAL: BETA ACCOUNT SWITCHER */}
            {showBetaAccountModal && (
              <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
                  <div className="flex items-center justify-between border-b pb-2">
                    <h3 className="font-extrabold text-base text-purple-800">테스트 계정 선택</h3>
                    <button onClick={() => setShowBetaAccountModal(false)} className="text-slate-400"><X className="w-5 h-5" /></button>
                  </div>
                  <div className="space-y-2 max-h-72 overflow-y-auto ios-scroll">
                    {adminUserList.map((acc) => (
                      <button 
                        key={acc.id} 
                        onClick={() => {
                          setCurrentUser(acc);
                          setShowBetaAccountModal(false);
                          if (acc.isAdmin) setActiveTab('admin');
                          else setActiveTab('home');
                          triggerToast(`🧪 [${acc.nickname}] (${acc.role}) 계정으로 스위칭 되었습니다.`, 'info');
                        }} 
                        className="w-full p-3 bg-slate-50 border rounded-xl text-left flex items-center justify-between text-xs font-bold hover:bg-purple-50 transition"
                      >
                        <div>
                          <p className="text-slate-900">{acc.nickname} ({acc.role})</p>
                          <p className="text-[10px] text-slate-400">{acc.email}</p>
                        </div>
                        <span className="text-amber-600 font-mono w-12 text-right">{Number(acc.temperature).toFixed(1)}℃</span>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
